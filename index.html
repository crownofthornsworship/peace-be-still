const C=document.getElementById('game'),g=C.getContext('2d'),map=document.getElementById('map'),mg=map.getContext('2d'),$=id=>document.getElementById(id);const sea=new Image(),boatArt=new Image(),turtleArt=new Image();sea.src='assets/sea.png';boatArt.src='assets/boat.png';turtleArt.src='assets/turtle.png';const WORLD={w:6000,h:3800},TAU=Math.PI*2;let cw=0,ch=0,dpr=1,last=0,running=false,paused=false,stage=0,score=0,hearts=4,found=0,weather=0,weatherClock=0,calm=0,immunity=0,stormCount=0,objects=[],particles=[],player={x:3000,y:1900,vx:0,vy:0,a:0},input={x:0,y:0},keys={},seen=new Set(),sailTime=0,toastTime=0;const names=['Morning Crossing','Golden Shoals','The Wind Rises','Island Paths','Rain and Rainbow','Deep Blue Passage','The Watchful Coast','Many Waters','The Quiet Harbor','Open Horizon','The Great Crossing','Peace, Be Still'];const verses=['Jesus said, “Let us go across the lake.” — Mark 4:35','God is with us wherever we go. — Joshua 1:9','The disciples called to Jesus in the storm. — Mark 4:38','The Lord is my helper. — Hebrews 13:6','Jesus spoke to the wind and the waves. — Mark 4:39','The wind stopped, and everything was calm. — Mark 4:39','God cares for you. — 1 Peter 5:7','The Lord gives strength to his people. — Psalm 29:11','He leads me beside quiet waters. — Psalm 23:2','When I am afraid, I will trust in you. — Psalm 56:3','Jesus asked, “Why are you afraid?” — Mark 4:40','Even the wind and the sea obey him. — Mark 4:41'];const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);let audioOn=true;function speak(s){if(!audioOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.rate=.88;u.pitch=1.07;speechSynthesis.speak(u)}function resize(){dpr=Math.min(2,devicePixelRatio||1);cw=innerWidth;ch=innerHeight;C.width=cw*dpr;C.height=ch*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function note(t){$('notice').textCo function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function hud(){$('score').textContent='✦ '+score+'  ♥ '+hearts;$('goal').textContent='Discover '+found+'/5'}function card(title,body,buttons,eyebrow='Lake adventure'){$('panel').classList.remove('hidden');$('card').innerHTML=`<div class="eyebrow">${eyebrow}</div><h2>${title}</h2>${body}<div class="row">${buttons}</div>`;running=false;if('speechSynthesis'in window)speechSynthesis.cancel()}
function intro(){card('Peace, Be Still',`<img class="art" src="assets/sea.png" alt="Sunlit lake and distant hills"><p>Sail an open lake. Find glowing discoveries, explore islands, and steer around friendly sea creatures and changing storms.</p><p class="verse">Jesus is with the disciples when the weather changes. Their story is in Mark 4:35–41.</p><p class="tiny">Drag the round steering pad, or use arrow keys. Tap STEADY THE BOAT to make a safe wake through rough water. There are no ads or purchases.</p>`,`<button class="primary" id="go">Set Sail →</button><button class="secondary" id="voice">Narration: ${audioOn?'On':'Off'}</button>`);$('go').onclick=()=>{buildWorld();$('panel').classList.add('hidden');running=true;last=performance.now();requestAnimationFrame(loop);note('Sail anywhere. Find five glowing discoveries!')};$('voice').onclick=()=>{audioOn=!audioOn;localStorage.setItem('peaceVoice',audioOn?'on':'off');intro()}}
function win(){save();let finished=stage===11;card(finished?'The Sea Is Calm':'Voyage Complete!',`<p>You explored ${names[stage]} and found five discoveries. ✦ ${score} stars gathered!</p><p class="verse">${verses[stage]}</p><p>Jesus cared for His friends in the storm. You can tell Him when you feel afraid, too.</p>${finished?'<p>You can keep sailing new voyages. Your stars stay with you on this device.</p>':''}`,`<button class="primary" id="next">${finished?'Sail Again':'Next Voyage →'}</button><button class="secondary" id="menu">Home</button>`,'Mark 4 · A story of courage');speak(verses[stage]);$('next').onclick=()=>{stage=finished?0:stage+1;buildWorld();save();$('panel').classList.add('hidden');running=true;last=performance.now();requestAnimationFrame(loop)};$('menu').onclick=intro}

function update(dt){sailTime+=dt;weatherClock+=dt;if(weatherClock>16){weatherClock=0;weather=rand(0,.85);note(weather>.5?'A rain squall is rolling across the lake!':'The clouds are opening. Follow the sunshine!')}calm=Math.max(0,calm-dt);immunity=Math.max(0,immunity-dt);let ix=input.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),iy=input.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);let n=Math.hypot(ix,iy)||1;ix/=n;iy/=n;let acceleration=380*(weather>.5?.78:1);player.vx=(player.vx+ix*acceleration*dt)*Math.pow(.978,dt*60);player.vy=(player.vy+iy*acceleration*dt)*Math.pow(.978,dt*60);let speed=Math.hypot(player.vx,player.vy),max=weather>.5?240:300;if(speed>max){player.vx*=max/speed;player.vy*=max/speed}player.x=clamp(player.x+player.vx*dt,40,WORLD.w-40);player.y=clamp(player.y+player.vy*dt,40,WORLD.h-40);const lean=clamp(player.vx/max*.12,-.12,.12);player.a+=(lean-player.a)*(1-Math.exp(-dt*5));for(const o of objects){o.phase+=dt*(o.kind==='creature'?1.5:.6);if(o.kind==='creature'){o.x=clamp(o.x+Math.cos(o.phase)*22*dt,80,WORLD.w-80);o.y=clamp(o.y+Math.sin(o.phase*.7)*14*dt,80,WORLD.h-80)}let d=dist(player,o);if(d<o.r+34){if(o.kind==='treasure'&&!seen.has(o.id)){seen.add(o.id);o.kind='found';score+=10;found++;hud();save();note(['A shining shell! +10 stars','A little lantern! +10 stars','A new discovery! +10 stars'][found%3]);if(found>=5){setTimeout(win,700);running=false;return}}else if(o.kind==='harbor'&&o.hit<=0){o.hit=5;hearts=Math.min(4,hearts+1);hud();note('A safe harbor! Your boat feels ready again.')}else if(['reef','storm','creature'].includes(o.kind)&&immunity<=0&&calm<=0){immunity=2.5;hearts=Math.max(1,hearts-1);player.vx*=-.45;player.vy*=-.45;hud();note(o.kind==='creature'?'A playful sea creature splashed by!':'A wave bumped the boat. Keep going!')} }o.hit=Math.max(0,o.hit-dt)}if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('notice').classList.remove('show')}}

g.save();g.translate(player.x,player.y+Math.sin(sailTime*3)*4);g.rotate(player.a);g.shadowColor='#063a5b';g.shadowBlur=24;g.shadowOffsetY=15;if(calm>0){g.strokeStyle='#fff3a4';g.lineWidth=7;g.beginPath();g.arc(0,0,85,0,TAU);g.stroke()}if(boatArt.complete&&boatArt.naturalWidth)g.drawImage(boatArt,-80,-72,160,144);else{g.fillStyle='#8b522d';g.beginPath();g.ellipse(0,0,65,35,0,0,TAU);g.fill()}g.restore();g.restore();if(weather>.32){g.fillStyle=`rgba(18,42,68,${weather*.20})`;g.fillRect(0,0,cw,ch);g.strokeStyle=`rgba(236,246,255,${weather*.42})`;g.lineWidth=2;for(let i=0;i<Math.round(weather*46);i++){let x=(i*97+sailTime*120)%cw,y=(i*173+sailTime*195)%ch;g.beginPath();g.moveTo(x,y);g.lineTo(x-7,y+18);g.stroke()}}drawMap()}

function loop(t){if(!running)return;let dt=Math.min(.04,(t-last)/1000||.016);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}$('pauseBtn').onclick=pause;$('mapBtn').onclick=()=>map.classList.toggle('hidden');$('calmBtn').onclick=()=>{if(!running||calm>0)return;calm=2.3;immunity=2.3;score+=1;hud();note('Steady now! A calm path opens around the boat.')};addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault();if(e.key==='Escape')pause()});addEventListener('keyup',e=>keys[e.key]=false);let pad=$('pad'),nub=$('nub');function steer(e){let r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,n=Math.max(1,Math.hypot(x,y)/42);input.x=x/n/42;input.y=y/n/42;nub.style.transform=`translate(${input.x*36}px,${input.y*36}px)`}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);steer(e)});pad.addEventListener('pointermove',e=>{if(e.buttons)steer(e)});function stop(){input.x=input.y=0;nub.style.transform=''}pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);audioOn=localStorage.getItem('peaceVoice')!=='off';loadSave();intro();
